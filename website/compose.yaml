name: goblin-website
services:
  website:
    image: goblin-website:development
    build:
      context: ..
      dockerfile: website/Dockerfile
      target: development
    init: true
    read_only: true
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - type: bind
        source: .
        target: /app
        read_only: true
      - type: bind
        source: ../.artifacts/installation-assets/output
        target: /.artifacts/installation-assets/output
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 2s
      start_period: 5s
      retries: 20
