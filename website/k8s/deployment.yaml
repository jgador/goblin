apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: goblin-website
spec:
  # New Deployments default to one replica; hpa.yaml owns subsequent scaling.
  selector:
    matchLabels:
      app.kubernetes.io/name: goblin-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goblin-website
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: website
          # manage.sh replaces this with the exact tag imported into local k3s.
          image: docker.io/library/goblin-website:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            # One fresh visit/minute measured in local k3s; see website/README.md.
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
