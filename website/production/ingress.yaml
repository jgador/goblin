apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  namespace: goblin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.org/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [goblinboard.com]
      secretName: website-tls
  rules:
    - host: goblinboard.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 80
