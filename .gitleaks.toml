title = "Goblin secret scanning"
minVersion = "v8.30.1"

[extend]
useDefault = true

# Keep all upstream rules. Catch newer OpenAI key shapes without depending on
# the fixed lengths and embedded marker used by the upstream OpenAI rule.
[[rules]]
id = "goblin-openai-key"
description = "Possible OpenAI project, service-account, or admin key"
regex = '''\bsk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-"]

# Force-adding these ignored files must still fail, even if a token's format
# is not recognized by a content rule.
[[rules]]
id = "goblin-private-auth-file"
description = "Private Goblin or Codex authentication file"
path = '''(?:^|/)(?:\.goblin-auth|\.goblin-browser-test)/|(?:^|/)(?:auth\.json(?:\.[^/]*)?|owner-(?:token|password)(?:\.[^/]*)?)$'''
