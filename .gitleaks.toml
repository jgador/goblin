title = "Goblin secret scanning"
minVersion = "v8.30.1"

[extend]
useDefault = true

# Goblin's application initialization password is intentionally versioned.
# Permit only the canonical connection entry in this file, including the
# JSON-escaped quotes written by PostgreSQL setup. Other keys and rules apply.
[[allowlists]]
description = "Intentionally tracked Goblin PostgreSQL application connection"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)backend/src/Goblin\.Web/appsettings\.json$''']
regexTarget = "line"
regexes = ['''^\s*"Goblin"\s*:\s*"Host=goblin-postgres;Port=5432;Database=goblin;Username=goblin_app;Password=(?:[0-9a-f]{64}|\\"[0-9a-f]{64}\\")"\s*,?\s*$''']

# Keep all upstream rules. Catch newer OpenAI key shapes without depending on
# the fixed lengths and embedded marker used by the upstream OpenAI rule.
[[rules]]
id = "goblin-openai-key"
description = "Possible OpenAI project, service-account, or admin key"
regex = '''\bsk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-"]

# Force-adding these ignored files must still fail, even if a token's format
# is not recognized by a content rule.
[[rules]]
id = "goblin-private-auth-file"
description = "Private Goblin or Codex authentication file"
path = '''(?:^|/)(?:\.goblin-auth|\.goblin-browser-test)/|(?:^|/)(?:auth\.json(?:\.[^/]*)?|owner-password(?:\.[^/]*)?)$'''
