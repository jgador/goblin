# Administrator bootstrap; never applied by the GitHub deployment credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chisel-deployer
  namespace: goblin-chisel
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chisel-deployer
  namespace: goblin-chisel
rules:
  # Kubernetes cannot restrict create by resourceNames. This dedicated namespace
  # limits initial creation; subsequent reads and patches use explicit names.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [chisel]
    # rollout status lists/watches with metadata.name=chisel.
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [services, secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [services, secrets]
    resourceNames: [chisel]
    verbs: [get, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [create]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    resourceNames: [chisel-tunnel, chisel-dev]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chisel-deployer
  namespace: goblin-chisel
subjects:
  - kind: ServiceAccount
    name: chisel-deployer
    namespace: goblin-chisel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chisel-deployer
