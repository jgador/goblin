apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The installer downloads and verifies this upstream manifest before rendering.
resources:
  - sandbox.yaml
namespace: sandbox
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: agent-sandbox-controller
    patch: |-
      - op: replace
        path: /metadata/name
        value: sandbox
