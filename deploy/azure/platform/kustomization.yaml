apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../platform
  - ingress.yaml
patches:
  - target:
      group: agents.x-k8s.io
      version: v1beta1
      kind: Sandbox
      name: platform
    patch: |-
      - op: replace
        path: /spec/podTemplate/spec/containers/0/image
        value: __GOBLIN_IMAGE__
      - op: replace
        path: /spec/podTemplate/spec/containers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/podTemplate/spec/containers/0/env/0/value
        value: __GOBLIN_PUBLIC_ORIGIN__
      - op: add
        path: /spec/podTemplate/spec/containers/0/env/-
        value:
          name: GOBLIN_CHATGPT_ENABLED
          value: "true"
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: platform
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: nginx-ingress
                    app.kubernetes.io/instance: goblin-nginx
            ports:
              - protocol: TCP
                port: 8787
# Keep execution on the deployed image by updating the existing entry by name.
replacements:
  - source:
      group: agents.x-k8s.io
      version: v1beta1
      kind: Sandbox
      name: platform
      fieldPath: spec.podTemplate.spec.containers.[name=platform].image
    targets:
      - select:
          group: agents.x-k8s.io
          version: v1beta1
          kind: Sandbox
          name: platform
        fieldPaths:
          - spec.podTemplate.spec.containers.[name=platform].env.[name=GOBLIN_EXECUTION_IMAGE].value
