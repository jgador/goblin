apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goblin
  namespace: goblin
  annotations:
    nginx.org/ssl-redirect: "true"
    nginx.org/proxy-buffering: "false"
    nginx.org/proxy-http-version: "1.1"
    nginx.org/websocket-services: "platform"
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
    cert-manager.io/cluster-issuer: goblin-letsencrypt
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: __GOBLIN_PUBLIC_HOSTNAME__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform
                port:
                  number: 8787
  tls:
    - hosts: [__GOBLIN_PUBLIC_HOSTNAME__]
      secretName: goblin-public-tls
