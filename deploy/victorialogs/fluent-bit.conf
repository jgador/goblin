[SERVICE]
    Flush         1
    Log_Level     info
    storage.path  /var/lib/fluent-bit/storage

[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Tag               kube.*
    multiline.parser  docker, cri
    DB                /var/lib/fluent-bit/tail.db
    storage.type      filesystem
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           Off
    K8S-Logging.Parser  Off
    K8S-Logging.Exclude Off

[OUTPUT]
    Name              http
    Match             kube.*
    Host              goblin-victorialogs.goblin.svc.cluster.local
    Port              9428
    URI               /insert/jsonline
    Format            json_lines
    Json_date_key     _time
    Json_date_format iso8601
    Retry_Limit       False
