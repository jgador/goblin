apiVersion: v1
kind: ServiceAccount
metadata:
  name: goblin-fluent-bit
  namespace: goblin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: goblin-fluent-bit
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: goblin-fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: goblin-fluent-bit
subjects:
  - kind: ServiceAccount
    name: goblin-fluent-bit
    namespace: goblin
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: goblin-fluent-bit
  namespace: goblin
spec:
  selector:
    matchLabels:
      app: goblin-fluent-bit
  template:
    metadata:
      labels:
        app: goblin-fluent-bit
    spec:
      serviceAccountName: goblin-fluent-bit
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:4.2.2
          args: [-c, /fluent-bit/etc/goblin/fluent-bit.conf]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/goblin
              readOnly: true
            - name: container-logs
              mountPath: /var/log/containers
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: state
              mountPath: /var/lib/fluent-bit
      volumes:
        - name: config
          configMap:
            name: goblin-fluent-bit-config
        - name: container-logs
          hostPath:
            path: /var/log/containers
            type: Directory
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: state
          emptyDir:
            sizeLimit: 1Gi
