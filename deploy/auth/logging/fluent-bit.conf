[SERVICE]
    Flush                     1
    Grace                     30
    Log_Level                 warn
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    storage.path              /buffers/chunks
    storage.sync              normal
    storage.checksum          On
    storage.max_chunks_up     16
    storage.backlog.mem_limit 8M

[INPUT]
    Name                tail
    # Only Goblin's web container. Agent stdout includes private Work protocols.
    Path                /var/log/containers/*_goblin_auth-*.log
    Tag                 kube.*
    multiline.parser    cri
    DB                  /buffers/tail.db
    DB.Sync             Normal
    DB.Compare_Filename On
    Read_From_Head      On
    Inotify_Watcher     Off
    # New-file discovery; the standard image polls open files every 250 ms.
    Refresh_Interval    5
    Rotate_Wait         30
    Buffer_Chunk_Size   32k
    Buffer_Max_Size     256k
    Skip_Long_Lines     On
    storage.type        filesystem

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_Tag_Prefix     kube.var.log.containers.
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Cache_Use_Docker_Id On
    Kube_Meta_Cache_TTL 60s
    Buffer_Size         256k
    Merge_Log           On
    Merge_Log_Key       dotnet
    Keep_Log            On
    Labels              Off
    Annotations         Off
    Namespace_Labels    Off
    Namespace_Annotations Off
    K8S-Logging.Parser  Off
    K8S-Logging.Exclude Off

# Native filters retain 64-bit structured values without a Lua number conversion.
[FILTER]
    Name         nest
    Match        kube.*
    Operation    lift
    Nested_under dotnet
    Add_prefix   dotnet.

[FILTER]
    Name   modify
    Match  kube.*
    Rename dotnet.Timestamp timestamp
    Rename dotnet.Message message
    Rename dotnet.LogLevel level
    Rename dotnet.Category category
    Rename dotnet.EventId event_id
    Rename dotnet.State state
    Rename dotnet.Scopes scopes
    Rename dotnet.Exception exception

[FILTER]
    Name      modify
    Match     kube.*
    Condition Key_exists message
    Remove    log

[FILTER]
    Name   record_modifier
    Match  kube.*
    Record service goblin

[OUTPUT]
    Name                     http
    Match                    kube.*
    Host                     goblin-victorialogs.goblin.svc
    Port                     9428
    URI                      /logs/insert/jsonline?_stream_fields=service,kubernetes.namespace_name,kubernetes.container_name,stream&_msg_field=message,log&_time_field=timestamp,date
    Format                   json_lines
    Json_date_key            date
    Json_date_format         iso8601
    Header                   Content-Type application/stream+json
    Compress                 gzip
    Log_Response_Payload     Off
    Retry_Limit              False
    storage.total_limit_size 256M
