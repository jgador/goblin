apiVersion: v1
kind: Namespace
metadata:
  name: goblin
---
# Kept separate from the Sandbox so replacing the Sandbox preserves the login.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: goblin-auth-data
  namespace: goblin
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: app
  namespace: goblin
spec:
  podTemplate:
    metadata:
      labels:
        app: goblin-auth
    spec:
      serviceAccountName: goblin-execution-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: goblin-auth:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: GOBLIN_PUBLIC_ORIGIN
              value: http://localhost:8787
            - name: GOBLIN_PASSWORD_HASH_FILE
              value: /etc/goblin/owner-password
            - name: GOBLIN_EXECUTION_NAMESPACE
              value: agents
            - name: GOBLIN_EXECUTION_IMAGE
              value: goblin-auth:0.1.0
            - name: GOBLIN_HEADLAMP_URL
              value: http://goblin-headlamp.goblin.svc:4466
            - name: GOBLIN_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GOBLIN_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
            - name: owner-password
              mountPath: /etc/goblin
              readOnly: true
            - name: postgres-client
              mountPath: /etc/goblin-postgres
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: goblin-auth-data
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
        - name: owner-password
          secret:
            secretName: goblin-owner-password
            defaultMode: 0440
            items:
              - key: owner-password
                path: owner-password
        - name: postgres-client
          secret:
            secretName: goblin-postgres-app-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: goblin-auth
  namespace: goblin
spec:
  type: ClusterIP
  selector:
    app: goblin-auth
  ports:
    - name: http
      port: 8787
      targetPort: http
---
# UI access is through port-forward. Execution pods reach only the repository port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goblin-auth
  namespace: goblin
spec:
  podSelector:
    matchLabels:
      app: goblin-auth
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
          podSelector:
            matchLabels:
              app: goblin-execution
      ports:
        - {protocol: TCP, port: 8788}
---
apiVersion: v1
kind: Service
metadata:
  name: goblin-repository
  namespace: goblin
spec:
  type: ClusterIP
  selector:
    app: goblin-auth
  ports:
    - name: repository
      port: 8788
      targetPort: 8788
