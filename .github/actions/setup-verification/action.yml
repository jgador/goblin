name: Set up selected verification
description: Prepare only the toolchains needed by a CI verification group.
inputs:
  dotnet:
    description: Install the selected .NET SDK.
    default: "false"
  rust:
    description: Install Rust and its verification tools.
    default: "false"
  rust-cache:
    description: CI-only Cargo build namespace; release preparation leaves caching disabled.
    default: ""
  deployment:
    description: Install offline deployment tools.
    default: "false"
  packages:
    description: Install the root and frontend locked Node packages.
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: |
          package-lock.json
          frontend/package-lock.json
          website/video/package-lock.json
    - uses: ./.github/actions/setup-dotnet
      if: inputs.dotnet == 'true'
    - uses: ./.github/actions/setup-rust
      if: inputs.rust == 'true'
      with:
        cache: ${{ inputs.rust-cache }}
    - uses: ./.github/actions/setup-deployment
      if: inputs.deployment == 'true'
    - name: Install locked development packages
      if: inputs.packages == 'true'
      shell: bash
      run: make node-install
