name: CI
on:
  pull_request:
  push:
    branches: [master, "release/**"]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      csharp: ${{ steps.select.outputs.csharp }}
      rust: ${{ steps.select.outputs.rust }}
      javascript: ${{ steps.select.outputs.javascript }}
      integration: ${{ steps.select.outputs.integration }}
      installer: ${{ steps.select.outputs.installer }}
      image: ${{ steps.select.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version: "24"
      - name: Select verification from changed files
        id: select
        run: node scripts/ci.mts detect

  csharp:
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-verification
        with:
          dotnet: "true"
      - name: Verify C#
        run: node scripts/ci.mts run csharp

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-verification
        with:
          rust: "true"
          rust-cache: host-dev-test
          packages: "false"
      - name: Verify Rust
        run: node scripts/ci.mts run rust

  javascript:
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-verification
      - name: Verify JavaScript and TypeScript
        run: node scripts/ci.mts run javascript

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-verification
        with:
          dotnet: "true"
          rust: "true"
          rust-cache: integration-host-dev
          deployment: "true"
      - name: Verify shared and deployment contracts
        run: node scripts/ci.mts run integration

  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-verification
        with:
          dotnet: "true"
          rust: "true"
          rust-cache: installer-host-dev-musl-release
          deployment: "true"
      - name: Verify the release installer and browser journeys
        run: node scripts/ci.mts run installer

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version: "24"
      - name: Build and inspect the platform image
        run: node scripts/ci.mts run image

  test_results:
    needs: [changes, csharp, rust, javascript, integration, installer, image]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version: "24"
      - name: Report selected checks and enforce the merge result
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci.mts report
