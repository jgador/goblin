name: goblinctl native release
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Reviewed companion release PR number
        type: string
        required: true
      sha:
        description: Exact reviewed candidate commit (40-character SHA)
        type: string
        required: true
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: goblinctl-publication
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: candidate
        run: node scripts/goblinctl-release.mts approve-candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.pr }}
          RELEASE_SHA: ${{ inputs.sha }}
  linux:
    needs: candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-deployment
      - name: Verify candidate source
        run: |
          just fmt-check
          just clippy --workspace --all-targets -- -D warnings
          cargo xtask azure --check
          npm ci
          npm test
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/setup.spec.ts
      - name: Build from clean source and test the packaged executable
        run: |
          cargo xtask release-build --output .artifacts/goblinctl
          mkdir -p .artifacts/native-check
          tar -xzf .artifacts/goblinctl/goblinctl-x86_64-unknown-linux-musl.tar.gz -C .artifacts/native-check
          .artifacts/native-check/goblinctl --help
          GOBLINCTL_TEST_BINARY=.artifacts/native-check/goblinctl node --test dist/tests/deployment/*.test.js dist/tests/integration/local-login.test.js
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: goblinctl-linux-musl
          path: .artifacts/goblinctl/*
          if-no-files-found: error
  publish:
    needs: [candidate, linux]
    runs-on: ubuntu-24.04
    environment: goblinctl-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: goblinctl-linux-musl
          path: release-artifacts
      - name: Attest archive and dependency metadata
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-artifacts/goblinctl-x86_64-unknown-linux-musl.tar.gz
            release-artifacts/release.json
      - name: Publish the approved immutable version
        run: node scripts/goblinctl-release.mts publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.pr }}
          RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          RELEASE_DIRECTORY: release-artifacts
  pin:
    needs: [candidate, publish]
    permissions:
      contents: write
      pull-requests: write
      actions: write
      attestations: read
    uses: ./.github/workflows/goblinctl-pin.yml
    with:
      pr: ${{ inputs.pr }}
      sha: ${{ needs.candidate.outputs.sha }}
      version: ${{ needs.candidate.outputs.version }}
