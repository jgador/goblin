name: Publish goblinctl
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Merged source SHA (blank uses this master commit; version comes from Cargo.toml)
        type: string
permissions:
  contents: read
concurrency:
  group: goblinctl-publication
  cancel-in-progress: false
jobs:
  linux:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.identity.outputs.source }}
      version: ${{ steps.identity.outputs.version }}
      attempt: ${{ steps.identity.outputs.attempt }}
    steps:
      - name: Validate source input
        env:
          SOURCE: ${{ inputs.sha || github.sha }}
        run: '[[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-deployment
      - name: Require a merged commit and record its identity
        id: identity
        run: |
          git merge-base --is-ancestor HEAD origin/master
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "goblinctl") | .version')" >> "$GITHUB_OUTPUT"
      - name: Verify candidate source
        run: |
          just fmt-check
          just clippy --workspace --all-targets -- -D warnings
          npm ci
          npm test
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/setup.spec.ts tests/e2e/install.spec.ts
      - name: Build from clean source and test the packaged executable
        run: |
          cargo xtask release build-installer --output .artifacts/goblinctl
          mkdir -p .artifacts/native-check
          tar -xzf .artifacts/goblinctl/goblinctl-x86_64-unknown-linux-musl.tar.gz -C .artifacts/native-check
          .artifacts/native-check/goblinctl --help
          GOBLINCTL_TEST_BINARY=.artifacts/native-check/goblinctl node --test dist/tests/deployment/*.test.js dist/tests/integration/local-login.test.js
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: goblinctl-linux-musl-${{ github.run_attempt }}
          path: .artifacts/goblinctl/*
          if-no-files-found: error
  publish:
    needs: linux
    runs-on: ubuntu-24.04
    environment: goblinctl-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: goblinctl-linux-musl-${{ needs.linux.outputs.attempt }}
          path: .artifacts/goblinctl
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Attest archive and dependency metadata
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            .artifacts/goblinctl/goblinctl-x86_64-unknown-linux-musl.tar.gz
            .artifacts/goblinctl/release.json
      - name: Publish the selected immutable version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ needs.linux.outputs.source }}
        run: node scripts/release-github.mts publish-installer .artifacts/goblinctl
  pin:
    needs: [linux, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.linux.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-rust
      - name: Prepare the reviewed dependency update
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          cargo xtask release pin-installer --version "$VERSION"
          node scripts/release-github.mts pin-pr "$VERSION"
