name: Clean up expired Goblin release tests
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: goblin-azure-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/master' && vars.AZURE_RELEASE_TESTS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: azure-release-test
    timeout-minutes: 30
    env:
      AZURE_RELEASE_TESTS_ENABLED: ${{ vars.AZURE_RELEASE_TESTS_ENABLED }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: node scripts/release-azure.mts sweep
