name: Rust development checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Check goblinctl and Docker image dependencies
        run: cargo xtask dependencies check --locked
      - name: Check formatting
        run: just fmt-check
      - name: Lint Rust and tests
        run: just clippy --workspace --all-targets -- -D warnings
      - name: Run Rust tests
        run: just test --workspace
      - name: Run documentation tests
        run: just test-doc --workspace
      - name: Build native release
        run: cargo build --locked --release --package goblinctl --target x86_64-unknown-linux-musl
      - name: Check generated changes
        run: git diff --exit-code
