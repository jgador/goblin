name: Prepare Goblin release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [preview, stable]
        default: preview
      version:
        description: Goblin version (blank suggests the next version)
        type: string
      source-sha:
        description: Advanced — merged source SHA (blank uses this master commit)
        type: string
      recommend:
        description: Make recommended after publication
        type: boolean
        default: false
permissions:
  contents: read
  attestations: read
  actions: read
  pages: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      outcome: ${{ steps.prepare.outputs.outcome }}
      version: ${{ steps.prepare.outputs.version }}
      installer: ${{ steps.prepare.outputs.installer }}
      source: ${{ steps.prepare.outputs.source }}
      attempt: ${{ steps.identity.outputs.attempt }}
    steps:
      - name: Validate source input
        env:
          SOURCE: ${{ inputs.source-sha || github.sha }}
        run: '[[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-deployment
      - id: identity
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Resolve the release and its installer
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          bash scripts/build-goblinctl-release.sh target
          args=(--channel "$CHANNEL")
          if [[ -n "$VERSION" ]]; then args+=(--version "$VERSION"); fi
          cargo xtask release prepare "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.outcome == 'pin-required'
        with:
          name: installer-pin-${{ github.run_attempt }}
          path: |
            dependencies.toml
            dependencies.lock.json
          if-no-files-found: error
      - name: Verify approval and installation hosting settings
        if: steps.prepare.outputs.outcome == 'prepared'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-github.mts preflight
      - name: Test the selected source and published executable
        if: steps.prepare.outputs.outcome == 'prepared'
        run: |
          just fmt-check
          just clippy --workspace --all-targets -- -D warnings
          npm ci
          npm test
          mkdir -p .artifacts/published-bin
          tar -xzf .artifacts/goblinctl-check/goblinctl-x86_64-unknown-linux-musl.tar.gz -C .artifacts/published-bin
          GOBLINCTL_TEST_BINARY=.artifacts/published-bin/goblinctl node --test dist/tests/deployment/*.test.js dist/tests/integration/local-login.test.js
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/setup.spec.ts tests/e2e/install.spec.ts
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.outcome == 'prepared'
        with:
          name: goblin-candidate-${{ github.run_attempt }}
          path: .artifacts/goblin/*
          if-no-files-found: error
          retention-days: 30
  pin:
    needs: prepare
    if: needs.prepare.outputs.outcome == 'pin-required'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
      - uses: actions/download-artifact@v4
        with:
          name: installer-pin-${{ needs.prepare.outputs.attempt }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.installer }}
        run: node scripts/release-github.mts pin-pr "$VERSION"
  azure:
    name: Azure installation
    needs: prepare
    if: needs.prepare.outputs.outcome == 'prepared'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    environment: azure-release-test
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RELEASE_TESTS_ENABLED: ${{ vars.AZURE_RELEASE_TESTS_ENABLED }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RELEASE_REGION: ${{ vars.AZURE_RELEASE_REGION }}
      AZURE_RELEASE_VM_SIZE: ${{ vars.AZURE_RELEASE_VM_SIZE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require explicit Azure test configuration
        env:
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
        run: |
          test "$AZURE_RELEASE_TESTS_ENABLED" = true
          test -n "$AZURE_SUBSCRIPTION_ID" && test -n "$AZURE_RELEASE_REGION"
          test -n "$CLIENT" && test -n "$TENANT"
      - uses: azure/login@v2
        id: login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: |
          npm ci
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: goblin-candidate-${{ needs.prepare.outputs.attempt }}
          path: .artifacts/goblin
      - name: Install and verify the frozen candidate
        run: node scripts/release-azure.mts install .artifacts/goblin
      - name: Remove this run's test resources
        if: always() && steps.login.outcome == 'success'
        run: node scripts/release-azure.mts cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azure-result-${{ github.run_attempt }}
          path: .artifacts/azure-test/result.json
          if-no-files-found: warn
  ready:
    name: Ready to publish
    needs: [prepare, azure]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: actions/download-artifact@v4
        with:
          name: goblin-candidate-${{ needs.prepare.outputs.attempt }}
          path: .artifacts/goblin
      - uses: actions/download-artifact@v4
        with:
          name: azure-result-${{ needs.prepare.outputs.attempt }}
          path: .artifacts/azure-test
      - name: Seal the successful checks and show the summary
        run: cargo xtask release seal --azure-report .artifacts/azure-test/result.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: .artifacts/goblin/*
      - uses: actions/upload-artifact@v4
        with:
          name: goblin-ready-${{ needs.prepare.outputs.attempt }}
          path: .artifacts/goblin/*
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish Goblin
    needs: [prepare, ready]
    runs-on: ubuntu-24.04
    environment: goblin-release
    concurrency:
      group: goblin-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-rust
      - uses: actions/download-artifact@v4
        with:
          name: goblin-ready-${{ needs.prepare.outputs.attempt }}
          path: .artifacts/goblin
      - name: Publish the approved candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          node scripts/release-github.mts preflight
          node scripts/release-github.mts publish .artifacts/goblin
  installation-site:
    needs: [prepare, publish]
    uses: ./.github/workflows/goblin-install-site.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      recommend: ${{ inputs.recommend }}
    permissions:
      contents: write
      pages: write
      id-token: write
      attestations: read
