name: Goblin checks
on:
  pull_request:
  push:
    branches: [master, 'release/**']
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goblin-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source and deployment tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-deployment
      - name: Install locked development dependencies
        run: make install
      - name: Test source and deployment contracts
        run: |
          make check
          make release-build
          make release-check-installer
          make browser-install
          make test-browser ARGS="tests/e2e/setup.spec.ts tests/e2e/install.spec.ts"
          git diff --exit-code
  gate:
    name: goblin-checks
    needs: source
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.source.result }}
        run: '[[ "$RESULT" == success ]]'
