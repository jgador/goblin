name: Goblin checks
on:
  pull_request:
  push:
    branches: [master]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goblin-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source and deployment tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-deployment
      - name: Check formatting and Rust lints
        run: |
          just fmt-check
          just clippy --workspace --all-targets -- -D warnings
      - name: Test source and deployment contracts
        run: |
          npm ci
          npm test
          bash scripts/build-goblinctl-release.sh target
          cargo xtask release check-installer
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/setup.spec.ts tests/e2e/install.spec.ts
          git diff --exit-code
  gate:
    name: goblin-checks
    needs: source
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.source.result }}
        run: '[[ "$RESULT" == success ]]'
