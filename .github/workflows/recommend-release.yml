name: Recommend Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Goblin version to recommend or serve on the website
        type: string
        required: true
      recommend:
        description: Make this version the installation default (uncheck to preserve the recommendation)
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
  actions: read
  attestations: read
jobs:
  installation:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/installation-assets.yml
    with:
      version: ${{ inputs.version }}
      recommend: ${{ inputs.recommend }}
    secrets: inherit
