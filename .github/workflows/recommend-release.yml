name: Recommend Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Goblin version to recommend or redeploy to GitHub Pages
        type: string
        required: true
      recommend:
        description: Make this version the installation default (uncheck to repair GitHub Pages only)
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
  attestations: read
jobs:
  github_pages:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/github-pages.yml
    with:
      version: ${{ inputs.version }}
      recommend: ${{ inputs.recommend }}
