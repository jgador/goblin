name: Goblin deployment readiness
on:
  workflow_call:
    inputs:
      source-sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source-sha:
        description: Exact Goblin commit to deploy (never a floating branch)
        type: string
        required: true
permissions:
  contents: read
  attestations: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Require an immutable application revision
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-rust
      - name: Check goblinctl and Docker image dependencies
        run: cargo xtask dependencies check --locked
      - uses: ./.github/actions/setup-deployment
      - name: Require the published installer for this application
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/build-goblinctl-release.sh target
          cargo xtask release-check --repo "$GH_REPO"
          cargo xtask azure --check
      - name: Test the exact application and published installer pair
        run: |
          npm ci
          npm test
          mkdir -p .artifacts/published-bin
          tar -xzf .artifacts/goblinctl-check/goblinctl-x86_64-unknown-linux-musl.tar.gz -C .artifacts/published-bin
          GOBLINCTL_TEST_BINARY=.artifacts/published-bin/goblinctl node --test dist/tests/deployment/*.test.js dist/tests/integration/local-login.test.js
      - name: Record the verified deployment pair
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const installer = JSON.parse(fs.readFileSync('deploy/goblinctl-release.json', 'utf8'));
          fs.writeFileSync('.artifacts/deployment-pair.json', JSON.stringify({schemaVersion: 1, goblinSourceRef: process.env.SOURCE_SHA, installer}, null, 2) + '\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: verified-goblin-deployment
          path: .artifacts/deployment-pair.json
          if-no-files-found: error
