name: Website Release

on:
  workflow_call:
    inputs:
      installation-artifact:
        type: string
        required: true
      version:
        type: string
        required: true
      recommend:
        type: boolean
        default: false
  pull_request:
  merge_group:
  push:
    branches: [master]
    paths:
      - website/index.html
      - website/website.css
      - website/website.js
      - website/install/**
      - website/package-installation.mts
      - scripts/installation-assets.mts
      - scripts/release-github.mts
      - website/assets/**
      - website/Dockerfile
      - website/Dockerfile.dockerignore
      - website/nginx.conf
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    outputs:
      artifact: ${{ steps.snapshot.outputs.artifact }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install pinned Kubernetes client
        run: bash website/install-kubectl.sh
      - uses: actions/download-artifact@v7
        if: inputs.installation-artifact != ''
        with:
          name: ${{ inputs.installation-artifact }}
          path: .artifacts/installation-assets/output
      - name: Snapshot authenticated installation assets from GitHub Releases
        if: inputs.installation-artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/installation-assets.mts snapshot .artifacts/installation-assets/output --authenticate
      - uses: actions/upload-artifact@v6
        with:
          name: website-installation-${{ github.run_attempt }}
          path: .artifacts/installation-assets/output
          retention-days: 30
          if-no-files-found: error
      - id: snapshot
        run: echo "artifact=website-installation-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Check website source and production configuration
        run: |
          npm --prefix website run check
          node --test website/release.test.mjs
          node --test scripts/installation-assets.test.mts scripts/release-github.test.mts
          bash -n website/check-container.sh website/install-kubectl.sh
      - name: Build and inspect the production container
        run: |
          docker build --platform linux/amd64 --target production --file website/Dockerfile --tag goblin-website:verify .
          bash website/check-container.sh goblin-website:verify

  publish:
    needs: validate
    if: github.repository == 'jgador/goblin' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Require configured deployment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node website/release.mjs check-environment
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: .artifacts/installation-assets/output
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build, verify, and publish the same image
        id: image
        run: |
          image="ghcr.io/jgador/goblin-website:sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --platform linux/amd64 --target production --file website/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/jgador/goblin \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image" .
          bash website/check-container.sh "$image"
          docker push "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          node website/release.mjs check-public "$digest"
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '### Website candidate\n\nSource: %s\n\nImage: %s\n\nAwaiting website-production approval.\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    environment:
      name: website-production
      url: https://goblinboard.com
    concurrency:
      group: website-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Recheck protection and reject an outdated candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node website/release.mjs check-environment
          current=$(gh api repos/jgador/goblin/branches/master --jq .commit.sha)
          [[ "$current" == "$GITHUB_SHA" ]] || { echo 'master advanced while this candidate awaited approval; deploy the newer run.' >&2; exit 1; }
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: .artifacts/installation-assets/output
      - name: Reject a superseded installation recommendation
        run: node scripts/installation-assets.mts check-baseline .artifacts/installation-assets/output
      - name: Install pinned Kubernetes client
        run: bash website/install-kubectl.sh
      - name: Apply approved image and verify rollout
        env:
          WEBSITE_KUBECONFIG: ${{ secrets.WEBSITE_KUBECONFIG }}
          WEBSITE_DEPLOYMENT_UID: ${{ vars.WEBSITE_DEPLOYMENT_UID }}
          WEBSITE_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          umask 077
          mkdir -p .artifacts/website-production
          kubeconfig="$PWD/.artifacts/website-production/kubeconfig"
          trap 'rm -f "$kubeconfig"' EXIT
          [[ -n "$WEBSITE_KUBECONFIG" ]] || { echo 'WEBSITE_KUBECONFIG is missing.' >&2; exit 1; }
          printf '%s\n' "$WEBSITE_KUBECONFIG" > "$kubeconfig"
          unset WEBSITE_KUBECONFIG
          node website/release.mjs deploy "$WEBSITE_IMAGE" "$kubeconfig" "$WEBSITE_DEPLOYMENT_UID"
      - name: Verify the public website matches this release
        env:
          VERSION: ${{ inputs.version }}
          RECOMMENDATION: ${{ inputs.recommend && 'recommend' || 'preserve' }}
        run: node website/verify.mjs https://goblinboard.com "$VERSION" "$RECOMMENDATION"
